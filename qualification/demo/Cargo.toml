# Fixture project for the Windows qualification workflow
# (.github/workflows/windows-qualification.yml). Its Cargo.lock is imported
# into the crate catalog, mirrored, published, and then built offline from
# that mirror with `cargo build --locked --offline`.
[package]
name = "qualification-demo"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
itoa = "1"
memchr = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
