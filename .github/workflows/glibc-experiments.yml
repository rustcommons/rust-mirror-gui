name: glibc experiments (CI only)

# Owner-requested measurement for 0.5.0: how old a Linux can the GUI run on?
# Builds this commit three ways (the release's AlmaLinux 8 build, and
# cargo-libc targeting glibc 2.28 and 2.17), then runs each in old-distribution
# containers with the default renderer and with OpenGL: worker version, window
# drawn on Xvfb, and (once per binary) a real crate plan and sync over HTTPS.
# CI-only: nothing here is published. Containers share the runner's kernel, so
# old kernels are not tested. Method follows rust-mirror PR #46.
on:
  workflow_dispatch:
  pull_request:
    # Only when a PR is opened, or labelled run-glibc-experiments: later
    # pushes don't rerun this measurement.
    types: [opened, labeled]
    paths:
      - .github/workflows/glibc-experiments.yml
      - qualification/glibc/**
      - qualification/linux-launch.sh
permissions:
  contents: read
env:
  NAME: rust-mirror-gui
  CARGO_LIBC_COMMIT: e68ca7bf3a8ffd973c8576acc48abd0fbcc66d25
# One run per PR: a new push cancels the PR's older runs (pushes to main and
# tags are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  baseline:
    # Dependabot PRs run only the core checks (org runner budget).
    if: github.actor != 'dependabot[bot]' && (github.event.action != 'labeled' || github.event.label.name == 'run-glibc-experiments')
    # Exactly how build-binaries-core.yml builds the published Linux download.
    runs-on: ubuntu-22.04
    container: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
    steps:
      - run: dnf install -y git gcc binutils tar gzip findutils which
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
      - name: Rust toolchain in use
        run: rustc --version && cargo --version
      - name: Build (release, --locked)
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          cargo build --release --locked --bin "$NAME"
          mkdir bin && cp "target/release/$NAME" bin/rust-mirror-gui-alma8
          objdump -T bin/rust-mirror-gui-alma8 | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1 | tee bin/rust-mirror-gui-alma8.glibc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-alma8
          path: bin/

  cargo-libc:
    # Dependabot PRs run only the core checks (org runner budget).
    if: github.actor != 'dependabot[bot]' && (github.event.action != 'labeled' || github.event.label.name == 'run-glibc-experiments')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rustcommons/cargo-libc
          ref: ${{ env.CARGO_LIBC_COMMIT }}
          path: cargo-libc
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
      - name: Rust toolchain in use
        run: rustc --version && cargo --version
      - name: cargo-libc 0.7.0 at the pinned commit, Clang 18
        run: |
          test "$(git -C cargo-libc rev-parse HEAD)" = "$CARGO_LIBC_COMMIT"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-18 gcc g++ binutils
          cargo install --path cargo-libc --locked --root "$RUNNER_TEMP/cargo-libc" -j 2
          "$RUNNER_TEMP/cargo-libc/bin/cargo-libc" --version | tee versions.txt
          /usr/bin/clang-18 --version | head -1 | tee -a versions.txt
          gcc --version | head -1 | tee -a versions.txt
      - name: Build for glibc 2.28 and 2.17 (a failure is recorded, not fatal)
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/cargo-libc/bin:$PATH" CARGO_BUILD_JOBS=2
          mkdir -p bin logs
          for t in 2.28 2.17; do
            out="bin/rust-mirror-gui-libc$t"
            # --artifact names the executable cargo-libc checks after the build
            built="$RUNNER_TEMP/t$t/x86_64-unknown-linux-gnu/release/$NAME"
            if (cd app && CARGO_TARGET_DIR="$RUNNER_TEMP/t$t" cargo libc build --target "x86_64-unknown-linux-gnu.$t" --cc /usr/bin/clang-18 --artifact "$built" -- --release --locked) > "logs/build-$t.log" 2>&1; then
              cp "$built" "$out"
              cargo libc inspect "$out" --max-glibc "$t" > "logs/inspect-$t.log" 2>&1; echo "inspect exit $?" >> "logs/inspect-$t.log"
              objdump -T "$out" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1 > "$out.glibc"
              echo "glibc $t: built, highest symbol $(cat "$out.glibc")"
            else
              echo "glibc $t: BUILD FAILED"; tail -20 "logs/build-$t.log"
            fi
          done
          cp versions.txt logs/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-cargo-libc
          path: |
            bin/
            logs/

  launch:
    needs: [baseline, cargo-libc]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Pinned like rust-mirror's release gate; centos:6 and debian:7 are
        # below glibc 2.17 (controls: nothing should run there).
        image:
          - almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
          - ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
          - centos:7@sha256:be65f488b7764ad3638f236b7b515b3678369a5124c47b8d32916d6487418ea4
          - opensuse/leap:42.3@sha256:271c921a1c84d65467d565e3f1c754b75aa01ceed1a7ac39de4816683c355fd2
          - ubuntu:18.04@sha256:152dc042452c496007f07ca9127571cb9c29697f42acbfad72324b2bb2e43c98
          - ubuntu:16.04@sha256:1f1a2d56de1d604801a9671f301190704c25d604a416f59e03c04f5c6ffee0d6
          - debian:9@sha256:c5c5200ff1e9c73ffbf188b4a67eb1c91531b644856b4aefe86a58d2f0cb05be
          - debian:8@sha256:32ad5050caffb2c7e969dac873bce2c370015c2256ff984b70c1c08b3a2816a0
          - centos:6@sha256:a93df2e96e07f56ea48f215425c6f1673ab922927894595bb5c0ee4c5a955133
          - debian:7@sha256:2259b099d947443e44bbd1c94967c785361af8fd22df48a08a3942e2d5630849
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: qualification
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dl
          merge-multiple: true
      - name: Run every binary in the container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p work/bin
          # artifacts unpack with or without their bin/ folder
          find dl -type f -name 'rust-mirror-gui-*' ! -name '*.glibc' -exec cp {} work/bin/ \;
          [ -n "$(ls work/bin)" ] || { echo "::error::no binaries downloaded"; exit 1; }
          cp -r qualification work/
          ls -l work/bin
          docker pull --platform linux/amd64 "$IMAGE" || echo "pull failed"
          timeout 40m docker run --rm --platform linux/amd64 -v "$PWD/work:/work" --entrypoint /bin/sh "$IMAGE" /work/qualification/glibc/run-matrix.sh || echo "container exit $?"
          binaries='{"rust-mirror-gui-alma8":{"method":"AlmaLinux 8 build (published)","target_glibc":"2.28"},"rust-mirror-gui-libc2.28":{"method":"cargo-libc","target_glibc":"2.28"},"rust-mirror-gui-libc2.17":{"method":"cargo-libc","target_glibc":"2.17"}}'
          sudo chown -R "$(id -u)" work || true
          python3 qualification/glibc/collect.py work/out "${IMAGE%@*}" "${IMAGE#*@}" "$binaries" result.json
          slug=$(echo "${IMAGE%@*}" | tr ':/' '--'); echo "SLUG=$slug" >> "$GITHUB_ENV"
          mkdir -p "evidence/$slug" && cp result.json "evidence/$slug/" && cp -r work/out "evidence/$slug/out" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: launch-${{ env.SLUG }}
          path: evidence/

  summary:
    needs: launch
    if: always() && needs.launch.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: launch-*
          path: evidence
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-cargo-libc
          path: cl
      - name: results.json and a table
        run: |
          python3 - <<'EOF'
          import json, glob, os, platform
          rows = []
          for p in sorted(glob.glob('evidence/*/result.json')):
              rows += json.load(open(p))
          meta = {
              "ci_only": True, "commit": os.environ["GITHUB_SHA"], "run": os.environ["GITHUB_RUN_ID"],
              "cargo_libc_commit": os.environ["CARGO_LIBC_COMMIT"],
              "tools": open('cl/logs/versions.txt').read().splitlines() if os.path.exists('cl/logs/versions.txt') else [],
              "runner_kernel": platform.release(),
              "limits": ["Containers share the runner's kernel: old kernels are not tested.",
                         "Xvfb with Mesa software rendering only: no real GPU drivers.",
                         "openSUSE Leap 42.3 stands in for SLES 12 (no commercial SLES image)."],
          }
          json.dump({"meta": meta, "results": rows}, open('results.json', 'w'), indent=2)
          print("| image | binary | renderer | worker | window | net | result | reason |")
          for r in rows:
              print("|", r.get("image"), "|", r.get("binary"), "|", r.get("renderer"), "|", r.get("worker_version"), "|",
                    r.get("window_drawn"), "|", r.get("network_plan_sync"), "|", r.get("result"), "|", (r.get("failure_reason") or "")[:120], "|")
          EOF
        env:
          CARGO_LIBC_COMMIT: ${{ env.CARGO_LIBC_COMMIT }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glibc-results
          path: results.json
