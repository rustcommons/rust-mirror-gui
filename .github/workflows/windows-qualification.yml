name: Windows qualification

# Repeatable end-to-end qualification of the crate workflow on Windows, through
# the GUI's own worker (`rust-mirror-gui --worker`, the code path the window
# uses), built in release mode. Evidence: docs/evals/*-windows-qualification.md.
#
# The publish target is a local HTTPS stand-in for a Nexus raw hosted
# repository (qualification/nexus_fixture.py), not a real Nexus server.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-qualification.yml
      - qualification/**
      - tests/windows_qualification.rs
permissions:
  contents: read
jobs:
  crate-workflow:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Runner facts
        shell: pwsh
        run: |
          "Q=$env:RUNNER_TEMP\q" >> $env:GITHUB_ENV
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber
          Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion, AdapterCompatibility
          cargo --version; rustc --version; python --version
          (Get-Command openssl).Source

      - name: Build the app (release)
        run: cargo build --release --locked --bin rust-mirror-gui

      - name: Fetch rust-mirror's HTTPS fixture helper (pinned)
        shell: pwsh
        run: |
          # certificates() from rust-mirror scripts/prove_crates_https.py at
          # 3f95e92: a disposable CA, a signed CRL served over local HTTP, and a
          # 127.0.0.1 server certificate whose CRL distribution point names it.
          New-Item -ItemType Directory -Force "$env:Q" | Out-Null
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/rustcommons/rust-mirror/3f95e92060f7f89257e756bef79045e85af6e848/scripts/prove_crates_https.py -OutFile "$env:Q\prove_crates_https.py"
          $hash = (Get-FileHash "$env:Q\prove_crates_https.py").Hash
          if ($hash -ne '6BDBDCA73223C64A014EB6A895ABB0B06BA702415671DAF07AFAC051184FBBC9') { throw "unexpected helper hash $hash" }
          Write-Output "helper SHA-256 $hash"

      # One step: the runner ends a step's background processes when the step
      # ends, and the publish fixture must live through publish and the client
      # build.
      - name: Crate workflow through the worker, publish, offline client build
        shell: pwsh
        env:
          QUAL_PUBLISH_URL: https://127.0.0.1:8443/repository/crates-qual/
        run: |
          # Publish fixture (local HTTPS stand-in for a Nexus raw repository).
          New-Item -ItemType Directory -Force "$env:Q\nexus" | Out-Null
          $env:QUAL_PUBLISH_USER = "qual"
          $env:QUAL_PUBLISH_PASSWORD = [guid]::NewGuid().ToString("N")
          Write-Output "::add-mask::$env:QUAL_PUBLISH_PASSWORD"
          $env:FIXTURE_USER = $env:QUAL_PUBLISH_USER
          $env:FIXTURE_PASSWORD = $env:QUAL_PUBLISH_PASSWORD
          $fx = "$env:Q\fixture"
          $fixture = Start-Process python -PassThru -ArgumentList '-I', 'qualification/nexus_fixture.py', "$env:Q\prove_crates_https.py", "$env:Q\nexus", '8443', $fx -RedirectStandardOutput "$env:Q\fixture.out" -RedirectStandardError "$env:Q\fixture.err"
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path "$fx\ready")) {
            if ($fixture.HasExited -or (Get-Date) -gt $deadline) {
              Get-Content "$env:Q\fixture.out", "$env:Q\fixture.err"
              throw "fixture did not start"
            }
            Start-Sleep -Milliseconds 500
          }
          Get-Content "$env:Q\fixture.out"

          # The crate workflow through rust-mirror-gui --worker (release).
          $env:QUAL_DIR = "$env:Q\work"
          $env:QUAL_LOCK = "${{ github.workspace }}\qualification\demo\Cargo.lock"
          $env:QUAL_CA_FILE = "$fx\ca.pem"
          cargo test --release --locked --test windows_qualification -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:Q\fixture.err"; exit $LASTEXITCODE }
          $env:QUAL_PUBLISH_PASSWORD = ""

          # A fresh Cargo home fetches and builds offline from the published
          # mirror. TLS and revocation checks stay on: the test CA is trusted
          # through CARGO_HTTP_CAINFO, and the server certificate's CRL
          # distribution point serves a signed CRL.
          $client = "$env:Q\client"
          New-Item -ItemType Directory -Force "$client\home" | Out-Null
          Copy-Item -Recurse qualification\demo "$client\demo"
          Copy-Item "$env:Q\work\cargo-config.toml" "$client\home\config.toml"
          Get-Content "$client\home\config.toml"
          $before = (Get-FileHash "$client\demo\Cargo.lock").Hash
          $env:CARGO_HOME = "$client\home"
          $env:CARGO_TARGET_DIR = "$client\target"
          $env:CARGO_HTTP_CAINFO = "$fx\ca.pem"
          Push-Location "$client\demo"
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$client\target\debug\qualification-demo.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          $after = (Get-FileHash "$client\demo\Cargo.lock").Hash
          if ($before -ne $after) { throw "Cargo.lock changed" }
          Write-Output "Cargo.lock unchanged: $after"

          New-Item -ItemType File "$fx\stop" | Out-Null
          $fixture.WaitForExit(30000) | Out-Null
          Write-Output "CRL fetches during the run (revocation checks):"
          Get-Content "$fx\revocation-requests.json"

      - name: Fixture request summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:Q\fixture\requests.jsonl") {
            Get-Content "$env:Q\fixture\requests.jsonl" | ConvertFrom-Json | Group-Object method, status | Select-Object Count, Name | Format-Table
          }

      - name: Launch the window and capture it (PrintWindow)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:Q\shots" | Out-Null
          ./qualification/capture-window.ps1 -Exe target\release\rust-mirror-gui.exe -Out "$env:Q\shots\window-dx12.png"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-qualification-evidence
          path: |
            ${{ runner.temp }}\q\work\evidence.json
            ${{ runner.temp }}\q\work\crates.toml
            ${{ runner.temp }}\q\work\cargo-config.toml
            ${{ runner.temp }}\q\fixture\requests.jsonl
            ${{ runner.temp }}\q\fixture\revocation-requests.json
            ${{ runner.temp }}\q\shots
          if-no-files-found: warn
