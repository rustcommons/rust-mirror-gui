name: Release documentation
on:
  push:
  pull_request:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      verify_published:
        description: Verify all existing GitHub Release notes and the latest version
        type: boolean
        default: false
permissions:
  contents: read
# One run per PR: a new push cancels the PR's older runs (pushes to main and
# tags are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  release-documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Old source tags predate their documentation backfill.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
      - name: Check committed changelog and versioned notes
        run: python3 scripts/check-release-docs.py --repo "$GITHUB_REPOSITORY"
      - name: Release-asset helper tests (layouts old and new, draft release, API hosts)
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check this published GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/check-release-docs.py --repo "$GITHUB_REPOSITORY" --published-tag "$RELEASE_TAG"
      - name: Check all published notes and latest release
        if: github.event_name == 'workflow_dispatch' && inputs.verify_published
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-release-docs.py --repo "$GITHUB_REPOSITORY" --published
