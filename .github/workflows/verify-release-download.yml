name: Verify release downloads

# Read-only check of a published release's prebuilt downloads, as a user gets
# them: download the live assets, check SHA256SUMS and every attestation, then
# run the Windows and Linux archives (worker version, and the window: PrintWindow
# on Windows, Xvfb in old-distribution containers on Linux). Nothing is built
# and nothing is uploaded to the release. See docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v0.4.3
        required: true
  pull_request:
    paths:
      - .github/workflows/verify-release-download.yml
permissions:
  contents: read
env:
  NAME: rust-mirror-gui
  REPO: ${{ github.repository }}
  # A pull request checks the release this workflow was added for.
  TAG: ${{ inputs.tag || 'v0.5.2' }}
# One run per PR: a new push cancels the PR's older runs (pushes to main and
# tags are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  assets:
    # Dependabot PRs run only the core checks (org runner budget).
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    # The SHA-256 of each archive, from SHA256SUMS after its attestation
    # verified: the run jobs check their download against these before
    # running anything.
    outputs:
      windows-sha256: ${{ steps.sums.outputs.windows }}
      linux-sha256: ${{ steps.sums.outputs.linux }}
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Bundle script (this workflow's commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          sparse-checkout: scripts
          persist-credentials: false
      - name: Download every asset; checksums and attestations
        id: sums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dl && cd dl
          gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[]|"\(.name) \(.size)"' | tee ../assets.txt
          gh release download "$TAG" --repo "$REPO"
          # After 0.5.2, trusted-publishing.yml attaches exactly four crate
          # files first; its own verify job checks them. Set them aside.
          version="${TAG#v}"; crates=0
          if [ "$(printf '%s\n' 0.5.2 "$version" | sort -V | tail -n 1)" != 0.5.2 ]; then
            mkdir ../crates
            for f in "$NAME-$version.crate" "$NAME-$version.crates.cdx.json" SHA256SUMS-crates "$NAME-$version.crates.intoto.jsonl"; do
              [ -f "$f" ] || { echo "::error::$TAG has no $f"; exit 1; }
              mv "$f" ../crates/
            done
            (cd ../crates && sha256sum -c SHA256SUMS-crates)
            crates=4
          fi
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
          # 0.4.3 and 0.5.0: 4 archives, signed by release-binaries.yml.
          # Later releases: 4 archives and the SBOM, signed by the reusable
          # build-binaries.yml (SLSA Build L3), with an SBOM attestation too.
          if ls *.cdx.json >/dev/null 2>&1; then
            files=5; signer=build-binaries.yml
            # Built from the tag push: source and signer are the tag's commit,
            # on GitHub-hosted runners.
            commit=$(gh api "repos/$REPO/commits/$TAG" -q .sha)
            strict="--signer-digest $commit --source-digest $commit --deny-self-hosted-runners"
          else
            # 0.4.3 and 0.5.0 keep the identity they were published with.
            files=4; signer=release-binaries.yml; strict=""
          fi
          [ "$(wc -l < SHA256SUMS)" -eq $files ] || { echo "::error::SHA256SUMS must list $files files"; exit 1; }
          # From 0.5.2 on, the release also carries its signed provenance:
          # <name>-<version>.intoto.jsonl (Sigstore bundles, one per line).
          bundle=$(ls *.intoto.jsonl 2>/dev/null || true)
          extra=0; [ -n "$bundle" ] && extra=1
          # required for every release after 0.5.1 (the last one without it)
          version="${TAG#v}"
          if [ -z "$bundle" ] && [ "$(printf '%s\n' 0.5.1 "$version" | sort -V | tail -n 1)" != 0.5.1 ]; then
            echo "::error::$TAG has no $NAME-$version.intoto.jsonl"; exit 1
          fi
          [ "$(wc -l < ../assets.txt)" -eq $((files + 1 + extra + crates)) ] || { echo "::error::expected $files files, SHA256SUMS, $extra bundle file and $crates crate files"; exit 1; }
          signed=$(ls | grep -v '\.intoto\.jsonl$')
          for f in $signed; do
            gh attestation verify "$f" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/$signer" $strict >/dev/null
            echo "provenance verified ($signer): $f"
          done
          if [ $files -eq 5 ]; then
            for f in *.zip *.tar.gz; do
              gh attestation verify "$f" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/$signer" $strict \
                --predicate-type https://cyclonedx.org/bom --format json > ../att.json
              (cd .. && python3 -c "import json,sys; a=json.load(open('att.json')); s=json.load(open(sys.argv[1])); sys.exit(0 if any(x['verificationResult']['statement']['predicate'] == s for x in a) else 'the attested SBOM differs from ' + sys.argv[1])" dl/*.cdx.json)
              echo "SBOM attestation verified, same SBOM as the release's: $f"
            done
            python3 -c "import json,glob; d=json.load(open(glob.glob('*.cdx.json')[0])); print('SBOM:', d['bomFormat'], d['specVersion'], len(d.get('components', [])), 'components')"
          fi
          # The provenance bundle file: its subjects are exactly the release
          # files, they verify offline (--bundle), and it holds exactly
          # GitHub's stored provenance attestation. Releases before it get one built from the stored
          # attestations, so this path is exercised on every run.
          mkdir ../stored
          (cd ../stored && for f in $signed; do gh attestation download "../dl/$f" --repo "$REPO" --predicate-type https://slsa.dev/provenance/v1 > /dev/null; done)
          [ -n "$(ls stored/*.jsonl ../stored/*.jsonl 2>/dev/null)" ] || { echo "::error::no stored attestations were downloaded"; exit 1; }
          if [ -n "$bundle" ]; then
            b="$bundle"; echo "the release carries $b"
          else
            b=../assembled.intoto.jsonl
            python3 ../tools/scripts/provenance_bundle.py assemble "$b" ../stored/*.jsonl
            echo "no bundle file on $TAG (published before 0.5.2): checking one built from GitHub's stored attestations"
          fi
          python3 ../tools/scripts/provenance_bundle.py check "$b" $signed
          python3 ../tools/scripts/provenance_bundle.py match "$b" ../stored/*.jsonl
          for f in $signed; do
            gh attestation verify "$f" --bundle "$b" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/$signer" $strict >/dev/null
            echo "verified offline with $(basename "$b"): $f"
          done
          for f in *.tar.gz; do echo "== $f"; tar -tzf "$f"; done
          echo "== zip"; python3 -c "import zipfile,glob; [print(n) for n in zipfile.ZipFile(glob.glob('*.zip')[0]).namelist()]"
          echo "windows=$(awk '/x86_64-pc-windows-msvc\.zip$/ {print $1}' SHA256SUMS)" >> "$GITHUB_OUTPUT"
          echo "linux=$(awk '/x86_64-unknown-linux-gnu\.tar\.gz$/ {print $1}' SHA256SUMS)" >> "$GITHUB_OUTPUT"

  windows:
    needs: assets
    runs-on: windows-2022
    steps:
      - name: Capture script (this workflow's commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: qualification
          persist-credentials: false
      - name: Download, check and run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # verified by the assets job (attested SHA256SUMS)
          EXPECTED_SHA256: ${{ needs.assets.outputs.windows-sha256 }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $zip = "$env:NAME-$version-x86_64-pc-windows-msvc.zip"
          New-Item -ItemType Directory -Force dl, shots | Out-Null
          gh release download $env:TAG --repo $env:REPO --pattern $zip --pattern SHA256SUMS --dir dl
          # Run nothing that doesn't match the attested checksum.
          $expected = $env:EXPECTED_SHA256
          if (-not $expected) { throw "no attested checksum from the assets job" }
          $actual = (Get-FileHash "dl\$zip" -Algorithm SHA256).Hash.ToLower()
          Write-Output "SHA-256 $actual (SHA256SUMS: $expected)"
          if ($actual -ne $expected) { throw "checksum mismatch" }
          Expand-Archive "dl\$zip" -DestinationPath run
          $exe = (Resolve-Path "run\$env:NAME-$version-x86_64-pc-windows-msvc\$env:NAME.exe").Path
          Get-ChildItem (Split-Path $exe) | Format-Table Name, Length
          # A GUI-subsystem program: PowerShell's & neither waits nor captures
          # its output, so run it with Start-Process and a redirected stdout.
          New-Item -ItemType File -Force empty.txt | Out-Null
          Start-Process -FilePath $exe -ArgumentList '--worker', '--version' -Wait -NoNewWindow -RedirectStandardOutput worker.txt -RedirectStandardInput empty.txt
          $out = Get-Content worker.txt -Raw
          $out
          if (-not ($out -match '"protocol":1')) { throw "worker did not report protocol 1" }
          ./qualification/capture-window.ps1 -Exe $exe -Out shots\window.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-window
          path: shots

  linux:
    needs: assets
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # the same pinned images as the release workflow's launch test
        container: ['almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b', 'ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214']
    container: ${{ matrix.container }}
    steps:
      - name: Runtime packages (as documented) and test tools
        run: |
          sed -n 1,2p /etc/os-release
          if command -v dnf >/dev/null; then
            dnf install -y libxkbcommon-x11 vulkan-loader mesa-vulkan-drivers mesa-libEGL mesa-dri-drivers libXcursor libXrandr libXi \
              xorg-x11-server-Xvfb xorg-x11-utils python3 tar gzip curl
          else
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends libxkbcommon-x11-0 libvulkan1 mesa-vulkan-drivers libegl1 libgl1-mesa-dri libxcursor1 libxrandr2 libxi6 \
              xvfb x11-utils python3 curl ca-certificates
          fi
      - name: Launch scripts (this workflow's commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          sparse-checkout: qualification
          persist-credentials: false
      - name: Download from the public release URL, check and run
        shell: bash
        env:
          # verified by the assets job (attested SHA256SUMS)
          EXPECTED_SHA256: ${{ needs.assets.outputs.linux-sha256 }}
        run: |
          version="${TAG#v}"
          tgz="$NAME-$version-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/$REPO/releases/download/$TAG"
          curl -fsSLO "$base/$tgz"
          # Run nothing that doesn't match the attested checksum.
          [ -n "$EXPECTED_SHA256" ] || { echo "::error::no attested checksum from the assets job"; exit 1; }
          echo "$EXPECTED_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz"
          # From 0.5.0 on the fonts are built in: run with no system fonts at all.
          if [ -f "$NAME-$version-x86_64-unknown-linux-gnu/LICENSE-DejaVu.txt" ]; then
            rm -rf /usr/share/fonts /usr/local/share/fonts /etc/fonts
            echo "system fonts and fontconfig settings removed"
          fi
          exe="$NAME-$version-x86_64-unknown-linux-gnu/$NAME"
          cat "$NAME-$version-x86_64-unknown-linux-gnu/README.txt" | sed -n 1,12p
          "$exe" --worker --version < /dev/null | tee worker.txt
          grep -q '"protocol":1' worker.txt
          sh tools/qualification/linux-launch.sh "$exe" shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-window-${{ strategy.job-index }}
          path: shots
