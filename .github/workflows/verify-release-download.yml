name: Verify release downloads

# Read-only check of a published release's prebuilt downloads, as a user gets
# them: download the live assets, check SHA256SUMS and every attestation
# (scripts/release_assets.py verify, in the exact layout of the version), then
# run the Windows and Linux archives (worker version, and the window: PrintWindow
# on Windows, Xvfb in old-distribution containers on Linux). Nothing is built
# and nothing is uploaded to the release. See docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v0.4.3
        required: true
  # Also on changes to the release-verification code (checked against TAG).
  pull_request:
    paths:
      - .github/workflows/verify-release-download.yml
      - scripts/release_assets.py
      - scripts/provenance_bundle.py
      - scripts/test_release_assets.py
permissions:
  contents: read
env:
  NAME: rust-mirror-gui
  REPO: ${{ github.repository }}
  # A pull request checks the latest recorded release.
  TAG: ${{ inputs.tag || 'v0.5.3' }}
# One run per PR: a new push cancels the PR's older runs (pushes to main and
# tags are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  assets:
    # Dependabot PRs run only the core checks (org runner budget).
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    # The SHA-256 of each archive, from SHA256SUMS after its attestation
    # verified: the run jobs check their download against these before
    # running anything.
    outputs:
      windows-sha256: ${{ steps.sums.outputs.windows }}
      linux-sha256: ${{ steps.sums.outputs.linux }}
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Bundle script (this workflow's commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # scripts/release_assets.py checks the release in the exact layout of its
      # version (layout() and its tests): 0.4.3 and 0.5.0 (four archives,
      # release-binaries.yml), 0.5.1 (+ SBOM, build-binaries.yml, strict digests),
      # 0.5.2 (+ bundle), later releases (+ the .crate, in the one SHA256SUMS).
      # It also runs the Linux archive's worker on this runner.
      - name: Download every asset; checksums, attestations, bundle and SBOM
        id: sums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/scripts/release_assets.py verify --tag "$TAG" --output dl \
            --run-target x86_64-unknown-linux-gnu --github-output "$GITHUB_OUTPUT"
          cd dl
          for f in *.tar.gz; do echo "== $f"; tar -tzf "$f"; done
          echo "== zip"; python3 -c "import zipfile,glob; [print(n) for n in zipfile.ZipFile(glob.glob('*.zip')[0]).namelist()]"
          if ls *.cdx.json >/dev/null 2>&1; then
            python3 -c "import json,glob; d=json.load(open(glob.glob('*.cdx.json')[0])); print('SBOM:', d['bomFormat'], d['specVersion'], len(d.get('components', [])), 'components')"
          fi

  windows:
    needs: assets
    runs-on: windows-2022
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Capture script (this workflow's commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: qualification
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Release scripts (this workflow's commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          sparse-checkout: scripts
          persist-credentials: false
      # The same check trusted-publishing.yml's `verify` job runs on Windows:
      # every asset and attestation, then the downloaded worker.
      - name: Full asset verification on Windows; run the downloaded worker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/scripts/release_assets.py verify --tag "$TAG" --output "$RUNNER_TEMP/verification" --run-target x86_64-pc-windows-msvc
      - name: Download, check and run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # verified by the assets job (attested SHA256SUMS)
          EXPECTED_SHA256: ${{ needs.assets.outputs.windows-sha256 }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $zip = "$env:NAME-$version-x86_64-pc-windows-msvc.zip"
          New-Item -ItemType Directory -Force dl, shots | Out-Null
          gh release download $env:TAG --repo $env:REPO --pattern $zip --pattern SHA256SUMS --dir dl
          # Run nothing that doesn't match the attested checksum.
          $expected = $env:EXPECTED_SHA256
          if (-not $expected) { throw "no attested checksum from the assets job" }
          $actual = (Get-FileHash "dl\$zip" -Algorithm SHA256).Hash.ToLower()
          Write-Output "SHA-256 $actual (SHA256SUMS: $expected)"
          if ($actual -ne $expected) { throw "checksum mismatch" }
          Expand-Archive "dl\$zip" -DestinationPath run
          $exe = (Resolve-Path "run\$env:NAME-$version-x86_64-pc-windows-msvc\$env:NAME.exe").Path
          Get-ChildItem (Split-Path $exe) | Format-Table Name, Length
          # A GUI-subsystem program: PowerShell's & neither waits nor captures
          # its output, so run it with Start-Process and a redirected stdout.
          New-Item -ItemType File -Force empty.txt | Out-Null
          Start-Process -FilePath $exe -ArgumentList '--worker', '--version' -Wait -NoNewWindow -RedirectStandardOutput worker.txt -RedirectStandardInput empty.txt
          $out = Get-Content worker.txt -Raw
          $out
          if (-not ($out -match '"protocol":1')) { throw "worker did not report protocol 1" }
          ./qualification/capture-window.ps1 -Exe $exe -Out shots\window.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-window
          path: shots

  linux:
    needs: assets
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # the same pinned images as the release workflow's launch test
        container: ['almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b', 'ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214']
    container: ${{ matrix.container }}
    steps:
      - name: Runtime packages (as documented) and test tools
        run: |
          sed -n 1,2p /etc/os-release
          if command -v dnf >/dev/null; then
            dnf install -y libxkbcommon-x11 vulkan-loader mesa-vulkan-drivers mesa-libEGL mesa-dri-drivers libXcursor libXrandr libXi \
              xorg-x11-server-Xvfb xorg-x11-utils python3 tar gzip curl
          else
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends libxkbcommon-x11-0 libvulkan1 mesa-vulkan-drivers libegl1 libgl1-mesa-dri libxcursor1 libxrandr2 libxi6 \
              xvfb x11-utils python3 curl ca-certificates
          fi
      - name: Launch scripts (this workflow's commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          sparse-checkout: qualification
          persist-credentials: false
      - name: Download from the public release URL, check and run
        shell: bash
        env:
          # verified by the assets job (attested SHA256SUMS)
          EXPECTED_SHA256: ${{ needs.assets.outputs.linux-sha256 }}
        run: |
          version="${TAG#v}"
          tgz="$NAME-$version-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/$REPO/releases/download/$TAG"
          curl -fsSLO "$base/$tgz"
          # Run nothing that doesn't match the attested checksum.
          [ -n "$EXPECTED_SHA256" ] || { echo "::error::no attested checksum from the assets job"; exit 1; }
          echo "$EXPECTED_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz"
          # From 0.5.0 on the fonts are built in: run with no system fonts at all.
          if [ -f "$NAME-$version-x86_64-unknown-linux-gnu/LICENSE-DejaVu.txt" ]; then
            rm -rf /usr/share/fonts /usr/local/share/fonts /etc/fonts
            echo "system fonts and fontconfig settings removed"
          fi
          exe="$NAME-$version-x86_64-unknown-linux-gnu/$NAME"
          cat "$NAME-$version-x86_64-unknown-linux-gnu/README.txt" | sed -n 1,12p
          "$exe" --worker --version < /dev/null | tee worker.txt
          grep -q '"protocol":1' worker.txt
          sh tools/qualification/linux-launch.sh "$exe" shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-window-${{ strategy.job-index }}
          path: shots
