name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  windows-build:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo build --release --locked --bins
      - name: Stage trial package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/gui, dist/demo | Out-Null
          Copy-Item target/release/rust-mirror-gui.exe, TRYING.md, LICENSE dist/gui/
          Copy-Item target/release/fake-rust-mirror.exe dist/demo/demo-backend-not-a-mirror-tool.exe
          Copy-Item LICENSE dist/demo/
          Get-FileHash dist/gui/rust-mirror-gui.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: rust-mirror-gui-windows-x86_64
          path: dist/gui
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: demo-backend-windows-x86_64-not-a-mirror-tool
          path: dist/demo
          if-no-files-found: error
