name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo test --locked

  windows-build:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
        with:
          toolchain: 1.95.0
      - run: cargo build --release --locked --bin rust-mirror-gui
      - name: Stage trial package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/gui | Out-Null
          Copy-Item target/release/rust-mirror-gui.exe, TRYING.md, LICENSE dist/gui/
          Get-FileHash dist/gui/rust-mirror-gui.exe -Algorithm SHA256 | Format-List
      - name: Smoke-test the built-in worker
        shell: pwsh
        run: |
          $out = & dist/gui/rust-mirror-gui.exe --worker --version | Out-String
          Write-Output $out
          if ($out -notmatch '"protocol":1') { throw "worker did not report protocol 1" }
      - name: Window draws, fits the screen and works at its minimum size (PrintWindow)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force window-shots | Out-Null
          ./qualification/capture-window.ps1 -Exe dist/gui/rust-mirror-gui.exe -Out window-shots/first-window.png -MinimumOut window-shots/minimum-size.png -RequireOnScreen
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-window-captures
          path: window-shots
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-mirror-gui-windows-x86_64
          path: dist/gui
          if-no-files-found: error

  cargo-deny:
    # Advisories (RustSec), licenses, bans and sources; policy in deny.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
