name: Build release binaries (core, reusable)

# The release build without any signing: four targets, smoke tests,
# packaging (<name>-<version>-<target>.<zip|tar.gz>), the Linux launch test
# on old distributions, the CycloneDX SBOM (<name>-<version>.cdx.json) and
# SHA256SUMS (archives + SBOM). Result: the artifact `release-files`.
# Read-only: no job can request an OIDC token or write attestations.
#
# Called by build-binaries.yml (which then signs; releases), and directly by
# dry runs (release-binaries.yml on PRs) and reproducible-build.yml.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: true
      version:
        description: Version, without "v" (from Cargo.toml at ref)
        type: string
        required: true
      source-label:
        description: What README.txt says it was built from (the tag, or a dry-run note)
        type: string
        required: true
      launch-test:
        description: Launch the Linux archive on old distributions
        type: boolean
        default: true
      artifact-prefix:
        description: Prefix for artifact names (two builds in one run)
        type: string
        default: ''
permissions:
  contents: read
env:
  NAME: rust-mirror-gui
  # cargo-cyclonedx, installed with --locked at this version
  CYCLONEDX_VERSION: 0.5.10
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            # Build against an old glibc (2.28) so the binary also runs on
            # RHEL/AlmaLinux 8, Ubuntu 20.04 and Debian 10 or newer.
            # pinned by digest (almalinux:8, updated 2026-10-27)
            container: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - name: Build tools (Linux container)
        if: runner.os == 'Linux'
        run: |
          sed -n 1,2p /etc/os-release
          dnf install -y git gcc binutils python39 tar gzip findutils which
          alternatives --set python3 /usr/bin/python3.9
          # the workspace belongs to the runner user, not the container's root
          git config --global --add safe.directory '*'
          ldd --version 2>&1 | sed -n 1p
      - name: Release source (the tagged commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          path: src
          persist-credentials: false
      - name: Packaging tools (this workflow's commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: tools
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - name: Build (release, --locked)
        working-directory: src
        shell: bash
        run: |
          # Windows: link the C runtime statically, so users need no Visual C++
          # Redistributable; and /Brepro, so the linker writes content hashes
          # instead of the build time into the PE header, debug directory and
          # PDB id (otherwise two identical builds differ in 24 bytes).
          # Only release binaries; CI and dev builds are unchanged.
          if [ "${{ runner.os }}" = Windows ]; then export RUSTFLAGS='-C target-feature=+crt-static -C link-arg=/Brepro'; fi
          echo "RUSTFLAGS=${RUSTFLAGS:-}"
          cargo build --release --locked --bin "$NAME" --target "${{ matrix.target }}"
          rustc --version
      - name: Smoke test (built-in worker)
        shell: bash
        run: |
          exe="src/target/${{ matrix.target }}/release/$NAME"; [ -f "$exe.exe" ] && exe="$exe.exe"
          out=$("$exe" --worker --version < /dev/null)
          echo "$out"
          echo "$out" | grep -q '"protocol":1' || { echo "::error::worker did not report protocol 1"; exit 1; }
          echo "$out" | grep -q '"tool_version"' || { echo "::error::worker did not report its rust-mirror version"; exit 1; }
      - name: Smoke test (the window draws; PrintWindow)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          ./tools/qualification/capture-window.ps1 -Exe "src\target\${{ matrix.target }}\release\$env:NAME.exe" -Out shots\window.png
      - name: DLL imports (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Record what the executable needs from the system, and refuse if it
          # needs the Visual C++ runtime (it is linked statically, +crt-static).
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /nologo /dependents "src\target\${{ matrix.target }}\release\$env:NAME.exe" | Where-Object { $_ -match '^\s+\S+\.dll$' } | ForEach-Object { $_.Trim() }
          Write-Output "imports: $($deps -join ', ')"
          if (-not $deps) { Write-Output "::error::no DLL imports found; dumpbin output not parsed"; exit 1 }
          $crt = $deps | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt-)' }
          if ($crt) { Write-Output "::error::the executable still needs the C runtime: $($crt -join ', ')"; exit 1 }
          Write-Output "no Visual C++ / UCRT runtime DLLs imported"
      - id: glibc
        name: Minimum glibc (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          exe="src/target/${{ matrix.target }}/release/$NAME"
          min=$(objdump -T "$exe" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "highest GLIBC_ symbol version (minimum glibc): $min"; echo "linked libraries:"; objdump -p "$exe" | awk '/NEEDED/ {print "  " $2}'
          echo "min=$min" >> "$GITHUB_OUTPUT"
          built=$(ldd --version 2>&1 | sed -n 1p | grep -oE '[0-9]+\.[0-9]+$')
          echo "build runner glibc: $built"; echo "built=$built" >> "$GITHUB_OUTPUT"
      - name: Architecture (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: file "src/target/${{ matrix.target }}/release/$NAME"; otool -l "src/target/${{ matrix.target }}/release/$NAME" | grep -m1 -A3 LC_BUILD_VERSION
      - name: Package
        shell: bash
        env:
          SOURCE_LABEL: ${{ inputs.source-label }}
          VERSION: ${{ inputs.version }}
          GLIBC_MIN: ${{ steps.glibc.outputs.min }}
          GLIBC_BUILT: ${{ steps.glibc.outputs.built }}
        run: |
          exe="src/target/${{ matrix.target }}/release/$NAME"; [ -f "$exe.exe" ] && exe="$exe.exe"
          # releases from 0.5.0 on build in the DejaVu Sans font; ship its license
          font=src/assets/fonts/LICENSE-DejaVu.txt; [ -f "$font" ] || font=""
          python3 tools/packaging/package.py --binary "$exe" --license src/LICENSE ${font:+--font-license "$font"} --name "$NAME" \
            --version "$VERSION" --target "${{ matrix.target }}" --out dist \
            --glibc "$GLIBC_MIN" --glibc-built "$GLIBC_BUILT" \
            --source "$SOURCE_LABEL at commit $(git -C src rev-parse HEAD)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: ${{ inputs.artifact-prefix }}window-${{ matrix.target }}
          path: shots

  linux-launch:
    # The Linux binary must start and draw its window on old distributions.
    needs: build
    if: inputs.launch-test
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # pinned by digest: almalinux:8 (2026-10-27), ubuntu:20.04 (2025-04-09)
        container: ['almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b', 'ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214']
    container: ${{ matrix.container }}
    steps:
      - name: Runtime and test packages
        run: |
          sed -n 1,2p /etc/os-release
          if command -v dnf >/dev/null; then
            # runtime: the packages README.txt lists for RHEL-family systems
            dnf install -y libxkbcommon-x11 vulkan-loader mesa-vulkan-drivers mesa-libEGL mesa-dri-drivers libXcursor libXrandr libXi \
              xorg-x11-server-Xvfb xorg-x11-utils python3 tar gzip
          else
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            # runtime: the packages README.txt lists for Debian/Ubuntu
            apt-get install -y --no-install-recommends libxkbcommon-x11-0 libvulkan1 mesa-vulkan-drivers libegl1 libgl1-mesa-dri libxcursor1 libxrandr2 libxi6 \
              xvfb x11-utils python3
          fi
          ldd --version 2>&1 | sed -n 1p
      - name: Test scripts (this workflow's commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: tools
          sparse-checkout: qualification
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact-prefix }}dist-x86_64-unknown-linux-gnu
          path: dist
      - name: Start the worker and the window (Xvfb)
        shell: bash
        run: |
          # No system fonts at all: the app's fonts are built in (0.5.0 on).
          # Packages such as Xvfb may pull fonts in; remove them all.
          if tar -tzf dist/*.tar.gz | grep -q LICENSE-DejaVu.txt; then
            rm -rf /usr/share/fonts /usr/local/share/fonts /etc/fonts
            echo "system fonts and fontconfig settings removed"
          fi
          tar -xzf dist/*.tar.gz
          exe=$(ls -d rust-mirror-gui-*/)rust-mirror-gui
          "$exe" --worker --version < /dev/null | tee worker.txt
          grep -q '"protocol":1' worker.txt
          ok=0; sh tools/qualification/linux-launch.sh "$exe" shots/default || ok=1
          echo "--- with WGPU_BACKEND=gl (OpenGL), for comparison"
          WGPU_BACKEND=gl sh tools/qualification/linux-launch.sh "$exe" shots/gl || echo "OpenGL launch failed too"
          [ $ok -eq 0 ] || { echo "::error::the default launch failed on ${{ matrix.container }}"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ inputs.artifact-prefix }}linux-launch-${{ strategy.job-index }}
          path: shots

  checksums:
    needs: [build, linux-launch]
    # runs after a passed or skipped launch test, never after a failed one
    if: always() && needs.build.result == 'success' && (needs.linux-launch.result == 'success' || needs.linux-launch.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ inputs.artifact-prefix }}dist-*
          path: dist
          merge-multiple: true
      - name: Release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          path: src
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
        with:
          toolchain: 1.95.0
      - name: SBOM (CycloneDX, every target's dependencies)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cargo install cargo-cyclonedx --version "$CYCLONEDX_VERSION" --locked --root "$RUNNER_TEMP/cdx"
          cd src
          "$RUNNER_TEMP/cdx/bin/cargo-cyclonedx" cyclonedx --format json --spec-version 1.6 --target all --override-filename sbom
          python3 -c "import json; d=json.load(open('sbom.json')); print(d['bomFormat'], d['specVersion'], len(d.get('components', [])), 'components')"
          mv sbom.json "../dist/$NAME-$VERSION.cdx.json"
      - name: Expected files and SHA256SUMS
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd dist
          for t in x86_64-pc-windows-msvc.zip x86_64-unknown-linux-gnu.tar.gz aarch64-apple-darwin.tar.gz x86_64-apple-darwin.tar.gz; do
            [ -f "$NAME-$VERSION-$t" ] || { echo "::error::missing $NAME-$VERSION-$t"; exit 1; }
          done
          [ -f "$NAME-$VERSION.cdx.json" ] || { echo "::error::missing the SBOM"; exit 1; }
          [ "$(ls | wc -l)" -eq 5 ] || { echo "::error::unexpected files: $(ls)"; exit 1; }
          # list the files first: a redirect would create SHA256SUMS before ls runs
          files=$(ls | LC_ALL=C sort)
          sha256sum $files > ../SHA256SUMS && mv ../SHA256SUMS SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" -eq 5 ] || { echo "::error::SHA256SUMS must list the 4 archives and the SBOM"; exit 1; }
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}release-files
          path: dist/*
          if-no-files-found: error
