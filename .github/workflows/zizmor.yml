name: zizmor

# Security lint of the GitHub Actions workflows (zizmor). Fails on findings;
# any suppression is an inline `# zizmor: ignore[rule]` with a reason.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# One run per PR: a new push cancels the PR's older runs (pushes to main and
# tags are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # report in the log and fail the job; no code-scanning upload
          advanced-security: false
          version: 1.32.0
