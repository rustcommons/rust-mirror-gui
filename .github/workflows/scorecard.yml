name: OpenSSF Scorecard

# Supply-chain checks by the OpenSSF Scorecard. Results are published (for the
# README badge) and uploaded to code scanning. publish_results restricts this
# workflow: only the steps below, no top-level env or defaults.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 2' # Tuesdays
  branch_protection_rule:
  workflow_dispatch:
# Scorecard reads actions, checks, issues and more (its official template).
permissions: read-all # zizmor: ignore[excessive-permissions] read-only, needed by Scorecard
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish the results
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
