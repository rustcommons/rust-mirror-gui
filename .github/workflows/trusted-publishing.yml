# Rust Commons standard release pipeline (phase 2: the crate and the binaries); see
# https://github.com/rustcommons/.github/blob/main/docs/TRUSTED-PUBLISHING.md
# crates.io binds Trusted Publishing to this file name and the `crates-io`
# environment; never rename either. Owner settings on crates.io
# (rust-mirror-gui → Settings → Trusted Publishing → GitHub): repository owner
# rustcommons, repository name rust-mirror-gui, workflow filename
# trusted-publishing.yml, environment crates-io.
#
# The only way to publish to crates.io (since 2026-11-16; no API token exists).
# In this binary repository `build` calls the isolated reusable builder and
# signer build-binaries.yml: it builds the crate and the four binaries (every
# qualification gate) and, on a v* tag push only, signs them in its own job
# "Build / Checksums and attestations", all before the owner's approval. There
# is no top-level `attest` job. `github-release` then creates the release with
# every asset; nothing waits for a hand-made release any more.
name: Trusted publishing
on:
  push:
    tags: ['v*']
  # Dry runs: gate and the full build, never sign or publish.
  pull_request:
    paths:
      - '.github/workflows/trusted-publishing.yml'
      - '.github/workflows/build-binaries.yml'
      - '.github/workflows/build-binaries-core.yml'
      - 'scripts/release-gate.py'
      - 'scripts/check-release-docs.py'
      - 'scripts/release_assets.py'
      - 'scripts/provenance_bundle.py'
      - 'src/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packaging/**'
      - 'qualification/linux-launch.sh'
      - 'qualification/xwd2png.py'
      - 'qualification/capture-window.ps1'
      - 'CHANGELOG.md'
      - 'docs/releases/**'
  workflow_dispatch:
permissions:
  contents: read
# A tag run is never cancelled; only newer pushes to the same PR supersede.
concurrency:
  group: trusted-publishing-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CRATE: rust-mirror-gui
jobs:
  gate:
    name: Release gate
    # Dependabot PRs run only the core checks (org runner budget).
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Reads CI results for the tagged commit.
      actions: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
      publish: ${{ steps.gate.outputs.publish }}
      crates: ${{ steps.gate.outputs.crates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
      - name: Rust toolchain in use
        run: rustc --version && cargo --version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Decide whether this run may publish
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-gate.py --event "$EVENT" --ref-name "$REF_NAME" \
            --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
      # This repository's own guards (formerly the `check` job).
      - name: Tag, Cargo.toml and main agree; exactly the rust-mirror-gui crate
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.gate.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "$manifest" = "$VERSION" ] || { echo "::error::Cargo.toml says $manifest, the release is $VERSION"; exit 1; }
          if [ "$EVENT" = push ]; then
            [ "v$manifest" = "$TAG" ] || { echo "::error::tag $TAG but Cargo.toml says $manifest"; exit 1; }
            [ "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" ] || { echo "::error::checkout is not the tagged commit"; exit 1; }
            git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          fi
          cargo metadata --locked --no-deps --format-version 1 > metadata.json
          python3 -c "import json; d=json.load(open('metadata.json')); names=[p['name'] for p in d['packages']]; assert len(d['workspace_members']) == 1 and names == ['rust-mirror-gui'], names"
          echo "Source $(git rev-parse HEAD): the single rust-mirror-gui crate, version $VERSION."

  build:
    name: Build
    needs: gate
    # The nested "Checksums and attestations" job signs only on a v* tag push and
    # is the only job that uses these two grants; every build job holds contents read.
    permissions:
      contents: read
      id-token: write
      attestations: write
    # build-binaries.yml builds the crate and all four binaries through the
    # read-only core (every qualification gate, one SBOM, one SHA256SUMS) and, on
    # the tag, signs them in its own job. Dry runs build the checked-out commit
    # and never sign.
    uses: $/.github/workflows/build-binaries.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      version: ${{ needs.gate.outputs.version }}
      source-label: ${{ github.event_name == 'push' && format('v{0}', needs.gate.outputs.version) || 'pull request or manual run (dry run, not a release)' }}
      sign: ${{ needs.gate.outputs.publish == 'true' }}

  publish:
    name: Publish to crates.io
    # `gate` is listed so the condition can read its output.
    needs: [gate, build]
    if: needs.gate.outputs.publish == 'true' && github.repository == 'rustcommons/rust-mirror-gui'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The owner's approval click. Everything is built and signed before it.
    environment: crates-io
    permissions:
      contents: read
      id-token: write # exchanged for a short-lived crates.io token
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      CRATES: ${{ needs.gate.outputs.crates }}
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
      - name: Rust toolchain in use
        run: rustc --version && cargo --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/dist
      - name: Re-check SHA256SUMS
        run: cd "$RUNNER_TEMP/dist" && sha256sum -c SHA256SUMS
      # An existing publication must already be exactly the attested crate; then
      # no token is minted.
      - name: Recheck after owner approval; refuse a different publication
        id: registry
        run: |
          set -euo pipefail
          code=$(curl -s -o api.json -w '%{http_code}' -A 'rustcommons-release' "https://crates.io/api/v1/crates/$CRATE/$VERSION")
          case "$code" in
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            200)
              expected=$(sha256sum "$RUNNER_TEMP/dist/$CRATE-$VERSION.crate" | cut -d' ' -f1)
              actual=$(jq -r '.version.checksum' api.json)
              [ "$expected" = "$actual" ] || { echo "::error::crates.io already has $CRATE $VERSION with checksum $actual, not the attested $expected"; exit 1; }
              echo "$CRATE $VERSION is already on crates.io as the attested crate; skipping."
              echo "published=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io answered HTTP $code"; exit 1 ;;
          esac
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.registry.outputs.published == 'false'
        id: auth
      - name: Publish release crates in dependency order
        if: steps.registry.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for crate in $(jq -r '.[]' <<<"$CRATES"); do
            # Publish only bytes identical to the checksummed, attested file.
            cargo package --locked -p "$crate"
            cmp "target/package/$crate-$VERSION.crate" "$RUNNER_TEMP/dist/$crate-$VERSION.crate"
            cargo publish --locked -p "$crate"
          done

  github-release:
    name: GitHub release
    needs: [gate, publish]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # gh attestation verify/download (read-only)
      attestations: read
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Artifact names from build-binaries-core.yml and build-binaries.yml in this run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-provenance
          path: ${{ runner.temp }}/dist
      # Before any upload: the exact asset set, every attestation (signer
      # build-binaries.yml at the tag commit), the bundle equal to GitHub's stored
      # attestations and the SBOM bound to every archive and the crate. Then a
      # draft is created (or a draft left by a killed run is resumed) only if its
      # tag, title, body and state are exactly ours; missing assets are uploaded,
      # all are checked, and only then it is published. Existing assets are never
      # replaced; a published release is never modified.
      - name: Create the draft release from the committed notes, add only missing assets, publish
        run: python3 scripts/release_assets.py release --root . --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --assets "$RUNNER_TEMP/dist"

  verify:
    name: Verify publication
    needs: [gate, github-release]
    if: needs.gate.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      # gh attestation verify/download (read-only)
      attestations: read
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Every asset's digest, SHA256SUMS, provenance (signer build-binaries.yml,
      # source and signer = the tag commit), the bundle against GitHub's store and
      # the SBOM bindings; then the downloaded binary's worker runs natively. The
      # window checks stay in verify-release-download.yml (post-publication).
      - name: Download, verify every asset and attestation, run the downloaded binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: python scripts/release_assets.py verify --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/verification" --run-target "$TARGET"
      - name: Live release body equals the committed notes
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 scripts/check-release-docs.py --repo "$GITHUB_REPOSITORY" --published-tag "$RELEASE_TAG"
      # Formerly the `verify` job: API, index and archive agree with the attested
      # crate, and the published archive is exactly the tag's source.
      - name: crates.io checksum equals the attested crate; exact tag payload
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          ua="rustcommons-release"
          api=""
          for i in $(seq 1 30); do
            api=$(curl -sf -A "$ua" "https://crates.io/api/v1/crates/$CRATE/$VERSION") && break; sleep 20
          done
          [ -n "$api" ] || { echo "::error::$CRATE $VERSION is not on crates.io"; exit 1; }
          # Downloads are saved to files and only read as data.
          printf '%s' "$api" > api.json
          sum=$(jq -r '.version.checksum' api.json)
          curl -sfL -A "$ua" -o index.jsonl "https://index.crates.io/ru/st/$CRATE"
          index=$(jq -r --arg v "$VERSION" 'select(.vers == $v) | .cksum' index.jsonl)
          curl -sfL -A "$ua" -o crate.tar.gz "https://static.crates.io/crates/$CRATE/$CRATE-$VERSION.crate"
          got=$(sha256sum crate.tar.gz | cut -d' ' -f1)
          attested=$(sha256sum "$RUNNER_TEMP/verification/$CRATE-$VERSION.crate" | cut -d' ' -f1)
          echo "archive $got; API $sum; index $index; attested $attested"
          [ "$got" = "$sum" ] && [ "$got" = "$index" ] && [ "$got" = "$attested" ] || { echo "::error::checksums disagree"; exit 1; }
          mkdir pkg tree && tar -xzf crate.tar.gz -C pkg
          vcs=$(jq -r '.git.sha1' "pkg/$CRATE-$VERSION/.cargo_vcs_info.json")
          [ "$vcs" = "$GITHUB_SHA" ] || { echo "::error::published from $vcs, not the tag's commit $GITHUB_SHA"; exit 1; }
          git archive HEAD | tar -x -C tree
          cd "pkg/$CRATE-$VERSION"
          bad=0
          for f in $(find . -type f ! -name .cargo_vcs_info.json ! -name Cargo.toml ! -name Cargo.toml.orig | sort); do
            cmp -s "$f" "../../tree/$f" || { echo "::error::$f differs from the tag"; bad=1; }
          done
          cmp -s Cargo.toml.orig ../../tree/Cargo.toml || { echo "::error::Cargo.toml differs from the tag"; bad=1; }
          [ $bad -eq 0 ] && echo "published $CRATE $VERSION ($got) is the attested crate and the tag's source ($GITHUB_SHA)"
          exit $bad
      - name: docs.rs build (pending is reported as pending)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          url="https://docs.rs/crate/$CRATE/$VERSION/status.json"
          for attempt in $(seq 1 40); do
            body=$(curl -s -A 'rustcommons-release' -w '\n%{http_code}' "$url")
            code=$(tail -n1 <<<"$body")
            if [ "$code" = 200 ]; then
              status=$(head -n -1 <<<"$body" | jq -r '.doc_status')
              if [ "$status" = true ]; then echo "docs.rs built $CRATE $VERSION."; exit 0; fi
              if [ "$status" = false ]; then echo "::error::docs.rs build failed for $CRATE $VERSION"; exit 1; fi
            fi
            sleep 30
          done
          echo "::warning::docs.rs build for $CRATE $VERSION is still pending after 20 minutes; not a pass."
          echo "docs.rs: PENDING" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
        if: matrix.target == 'x86_64-unknown-linux-gnu'
      - name: Clean locked install from crates.io
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          rustc --version
          export CARGO_HOME="$RUNNER_TEMP/published-cargo-home"
          root="$RUNNER_TEMP/published-install"
          cargo install "$CRATE" --version "=$VERSION" --locked --root "$root"
          jq -e --arg v "$VERSION" '.installs | keys | any(startswith("rust-mirror-gui " + $v + " "))' "$root/.crates2.json"
          "$root/bin/$CRATE" --worker --version < /dev/null > "$RUNNER_TEMP/version.jsonl"
          head -n1 "$RUNNER_TEMP/version.jsonl" | jq -e '.type == "hello" and .protocol == 1'
