name: Publish crate (Trusted Publishing)

# Publishes rust-mirror-gui to crates.io from a v* tag with a short-lived
# token from crates.io Trusted Publishing (OIDC): no stored API token.
#
# The only way to publish to crates.io (since 2026-11-16; the owner revoked
# the last API token). The publish job waits for the owner's approval of the
# crates-io environment. If a tag's version is already on crates.io (releases
# up to 0.5.0, published by hand), the publish job is skipped and only the
# verification runs.
#
# Owner settings on crates.io (rust-mirror-gui → Settings → Trusted
# Publishing → GitHub): repository owner rustcommons, repository name
# rust-mirror-gui, workflow filename trusted-publishing.yml, environment crates-io.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  CRATE: rust-mirror-gui
jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: v
        name: Tag and version agree; is the version on crates.io yet?
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "::error::tag $TAG but Cargo.toml says $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "rustcommons-release-check" "https://crates.io/api/v1/crates/$CRATE/$version")
          case "$code" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT"; echo "$CRATE $version is already on crates.io: verify only" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT"; echo "$CRATE $version is not on crates.io: publish" ;;
            *) echo "::error::crates.io answered HTTP $code"; exit 1 ;;
          esac

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    # Only v* tags may use this environment; the owner approves each run.
    environment: crates-io
    permissions:
      contents: read
      id-token: write # exchanged for a short-lived crates.io token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
        with:
          toolchain: 1.95.0
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  verify:
    # The published archive must be this tag's source.
    needs: [check, publish]
    if: always() && needs.check.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Checksum and source of the published crate
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ua="rustcommons-release-check"
          for i in $(seq 1 30); do
            api=$(curl -sf -A "$ua" "https://crates.io/api/v1/crates/$CRATE/$VERSION") && break; sleep 20
          done
          [ -n "${api:-}" ] || { echo "::error::$CRATE $VERSION is not on crates.io"; exit 1; }
          # Downloads are saved to files and only read as data (never piped
          # into an interpreter or executed).
          printf '%s' "$api" > api.json
          sum=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version']['checksum'])" api.json)
          curl -sfL -A "$ua" -o index.jsonl "https://index.crates.io/ru/st/$CRATE"
          index=$(python3 -c "import json,sys,os; print([json.loads(l) for l in open(sys.argv[1]) if json.loads(l)['vers']==os.environ['VERSION']][0]['cksum'])" index.jsonl)
          curl -sfL -A "$ua" -o crate.tar.gz "https://static.crates.io/crates/$CRATE/$CRATE-$VERSION.crate"
          got=$(sha256sum crate.tar.gz | cut -d' ' -f1)
          echo "archive $got; API $sum; index $index"
          [ "$got" = "$sum" ] && [ "$got" = "$index" ] || { echo "::error::checksums disagree"; exit 1; }
          mkdir pkg tree && tar -xzf crate.tar.gz -C pkg
          vcs=$(python3 -c "import json; print(json.load(open('pkg/$CRATE-$VERSION/.cargo_vcs_info.json'))['git']['sha1'])")
          [ "$vcs" = "$GITHUB_SHA" ] || { echo "::error::published from $vcs, not the tag's commit $GITHUB_SHA"; exit 1; }
          git archive HEAD | tar -x -C tree
          cd "pkg/$CRATE-$VERSION"
          bad=0
          for f in $(find . -type f ! -name .cargo_vcs_info.json ! -name Cargo.toml ! -name Cargo.toml.orig | sort); do
            cmp -s "$f" "../../tree/$f" || { echo "::error::$f differs from the tag"; bad=1; }
          done
          cmp -s Cargo.toml.orig ../../tree/Cargo.toml || { echo "::error::Cargo.toml differs from the tag"; bad=1; }
          [ $bad -eq 0 ] && echo "published $CRATE $VERSION ($got) is the tag's source ($GITHUB_SHA)"
          exit $bad
