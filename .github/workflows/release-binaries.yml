name: Release binaries

# Prebuilt, unsigned binaries for a published release (owner-authorized
# 2026-11-15). The build itself is the reusable workflow build-binaries.yml
# (four targets, smoke and launch tests, SBOM, SHA256SUMS, and, when
# publishing, the attestations it signs: SLSA Build L3). This workflow decides
# what to build, checks the tag and the release, and uploads to the existing
# GitHub Release for the tag. It never replaces or deletes release assets and
# refuses if the release does not match the tagged release notes.
#
# - push of a v* tag: build and publish (waits for the release, which the
#   post-publication step creates right after the tag);
# - workflow_dispatch: `tag` (an existing release tag) and `dry_run` (true by
#   default: build and verify everything, upload nothing) for backfills;
# - pull_request that changes the app, this workflow or packaging/: dry run of
#   the pull request's own code, as the next release would build it (all
#   builds, smoke and launch tests; nothing uploaded).
# See docs/RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.4.2
        required: true
      dry_run:
        description: Build and verify only; upload nothing
        type: boolean
        default: true
  pull_request:
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/release-binaries.yml
      - .github/workflows/build-binaries.yml
      - .github/workflows/build-binaries-core.yml
      - packaging/**
      - qualification/linux-launch.sh
      - qualification/xwd2png.py
permissions:
  contents: read
# One run per tag (never cancelled); one per PR (a new push cancels the older run).
concurrency:
  group: release-binaries-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NAME: rust-mirror-gui
  REPO: ${{ github.repository }}
jobs:
  prepare:
    # Dependabot PRs run only the core checks (org runner budget).
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      ref: ${{ steps.which.outputs.ref }}
      version: ${{ steps.check.outputs.version }}
      dry_run: ${{ steps.which.outputs.dry_run }}
      pr: ${{ steps.which.outputs.pr }}
    steps:
      - id: which
        name: Which tag, commit and mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pr=false
          case "$EVENT" in
            push) tag="$GITHUB_REF_NAME"; dry=false; ref="$GITHUB_SHA" ;;
            workflow_dispatch) tag="$INPUT_TAG"; dry="$INPUT_DRY_RUN"; ref="$INPUT_TAG" ;;
            # A pull request dry-runs its own head as the next release would
            # build it; the tag comes from Cargo.toml and need not exist yet.
            pull_request) tag=""; dry=true; ref="$PR_HEAD"; pr=true ;;
          esac
          if [ -n "$tag" ] && ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a release tag: $tag"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"; echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "tag '$tag', ref $ref, dry run: $dry"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.which.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: check
        name: Tag, commit and version agree
        env:
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG:-v$version}" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version $version at $(git rev-parse HEAD)"
          if [ -n "$TAG" ]; then
            [ "${TAG#v}" = "$version" ] || { echo "::error::tag $TAG but Cargo.toml says $version"; exit 1; }
            [ "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" ] || { echo "::error::checkout is not the tagged commit"; exit 1; }
          fi
      - name: The live release matches the tagged release notes
        if: steps.which.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          # The post-publication step creates the release right after the tag.
          for i in $(seq 1 60); do gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 && break; sleep 30; done
          python3 scripts/check-release-docs.py --repo "$REPO" --published-tag "$TAG"
      - name: Release guard, read-only (dry run of an existing release)
        if: steps.which.outputs.dry_run == 'true' && steps.which.outputs.pr == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          python3 scripts/check-release-docs.py --repo "$REPO" --published-tag "$TAG"
          echo "Assets already on $TAG:"; gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name'
      - name: Committed release documentation (pull request dry run)
        if: steps.which.outputs.pr == 'true'
        run: python3 scripts/check-release-docs.py --repo "$REPO"

  build-dry-run:
    # Dry runs: build, test, package and checksum; read-only, nothing signed.
    needs: prepare
    if: needs.prepare.outputs.dry_run == 'true'
    uses: $/.github/workflows/build-binaries-core.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
      source-label: ${{ needs.prepare.outputs.pr == 'true' && 'pull request (dry run, not a release)' || needs.prepare.outputs.tag }}

  build:
    # Publishing: build-binaries.yml builds and signs (SLSA Build L3).
    needs: prepare
    if: needs.prepare.outputs.dry_run == 'false'
    uses: $/.github/workflows/build-binaries.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
      source-label: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      # This run's commit: both the source and the signer workflow of the
      # attestations must be exactly this commit (the tag's, on a tag push).
      RUN_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-provenance
          path: bundle
      - name: Release still matches its notes; none of these assets exist yet
        run: |
          python3 scripts/check-release-docs.py --repo "$REPO" --published-tag "$TAG"
          existing=$(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name')
          for f in dist/* bundle/*; do
            if printf '%s\n' "$existing" | grep -qxF "$(basename "$f")"; then
              echo "::error::$(basename "$f") already exists on $TAG; assets are never replaced"; exit 1
            fi
          done
      - name: Verify the attestations before uploading
        run: |
          # provenance for every file, signed by the reusable build workflow
          for f in dist/*; do
            gh attestation verify "$f" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/build-binaries.yml" --signer-digest "$RUN_SHA" --source-digest "$RUN_SHA" --deny-self-hosted-runners > /dev/null
            echo "provenance verified: $(basename "$f")"
          done
          # the SBOM attestation for every archive, and it is exactly the SBOM
          # being published
          for f in dist/*.zip dist/*.tar.gz; do
            gh attestation verify "$f" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/build-binaries.yml" --signer-digest "$RUN_SHA" --source-digest "$RUN_SHA" --deny-self-hosted-runners \
              --predicate-type https://cyclonedx.org/bom --format json > att.json
            python3 -c "import json,sys; a=json.load(open('att.json')); s=json.load(open(sys.argv[1])); sys.exit(0 if any(x['verificationResult']['statement']['predicate'] == s for x in a) else 'the attested SBOM differs from ' + sys.argv[1])" dist/*.cdx.json
            echo "SBOM attestation verified, same SBOM: $(basename "$f")"
          done
          # the provenance bundle file: its subjects are exactly the release
          # files, they verify offline against it, and it holds exactly
          # GitHub's stored provenance attestation
          b=$(ls bundle/*.intoto.jsonl)
          python3 scripts/provenance_bundle.py check "$b" dist/*
          for f in dist/*; do
            gh attestation verify "$f" --bundle "$b" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/build-binaries.yml" --signer-digest "$RUN_SHA" --source-digest "$RUN_SHA" --deny-self-hosted-runners > /dev/null
            echo "verified with the bundle file: $(basename "$f")"
          done
          mkdir stored && (cd stored && for f in ../dist/*; do gh attestation download "$f" --repo "$REPO" --predicate-type https://slsa.dev/provenance/v1 > /dev/null; done)
          [ -n "$(ls stored/*.jsonl ../stored/*.jsonl 2>/dev/null)" ] || { echo "::error::no stored attestations were downloaded"; exit 1; }
          python3 scripts/provenance_bundle.py match "$b" stored/*.jsonl
      - name: Upload to the release (never replaces)
        run: gh release upload "$TAG" dist/* bundle/* --repo "$REPO"
      - name: Verify the live assets
        run: |
          mkdir check && cd check
          gh release download "$TAG" --repo "$REPO" --pattern "$NAME-*" --pattern SHA256SUMS
          sha256sum -c SHA256SUMS
          cmp SHA256SUMS ../dist/SHA256SUMS
          b=$(ls *.intoto.jsonl)
          cmp "$b" "../bundle/$b"
          for f in $(ls $NAME-* SHA256SUMS | grep -v '\.intoto\.jsonl$'); do
            gh attestation verify "$f" --bundle "$b" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/build-binaries.yml" --signer-digest "$RUN_SHA" --source-digest "$RUN_SHA" --deny-self-hosted-runners > /dev/null
            gh attestation verify "$f" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/build-binaries.yml" --signer-digest "$RUN_SHA" --source-digest "$RUN_SHA" --deny-self-hosted-runners > /dev/null
            echo "provenance verified: $f"
          done
