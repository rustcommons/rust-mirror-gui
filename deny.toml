# cargo-deny policy (org security baseline, 2026-11-15). CI runs
# `cargo deny check --all-features` (the cargo-deny job in ci.yml).

[graph]
# The four release targets; dependencies for other platforms don't ship.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = true

[advisories]
# RustSec advisory database. Vulnerabilities always fail.
version = 2
# An unmaintained crate anywhere in the graph fails; a known exception is
# listed in `ignore` with its reason, so each one is a reviewed decision.
unmaintained = "all"
yanked = "deny"
ignore = [
    # All four come only through eframe 0.37 (no direct use), and no
    # maintained replacement exists yet ("No safe upgrade is available").
    # Reviewed 2026-11-15; drop each when eframe moves off it.
    # winit's Wayland window decorations (sctk-adwaita -> ab_glyph):
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, via winit's Wayland decorations; unmaintained, no safe upgrade" },
    # Linux screen-reader support (accesskit -> atspi -> zbus):
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, via accesskit's Linux AT-SPI; unmaintained, no safe upgrade" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, via accesskit's Linux AT-SPI; unmaintained, no safe upgrade" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via accesskit's Linux AT-SPI; unmaintained, no safe upgrade" },
]

[licenses]
version = 2
# Every license used by the current dependency graph, and nothing else.
# Where a crate offers a choice (e.g. "Apache-2.0 OR GPL-2.0-only"), the
# permissive option on this list is the one used.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0", # webpki-roots: Mozilla's CA list
    "ISC",
    "MIT",
    "OFL-1.1", # fonts bundled by egui (epaint_default_fonts)
    "Ubuntu-font-1.0", # the Ubuntu font bundled by egui
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
# Several versions of one crate come from eframe/wgpu's own graph; reported,
# not fatal.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io only; no git or other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
